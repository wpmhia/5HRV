              - paragraph [ref=f1e143]: RMSSD reflects short-term beat-to-beat variability and is strongly influenced by cardiac vagal modulation. The value is below the fifth percentile for the selected age and reference-sex group. This is a nonspecific finding and may reflect physiology, acute illness, medication, measurement conditions or recording quality.
