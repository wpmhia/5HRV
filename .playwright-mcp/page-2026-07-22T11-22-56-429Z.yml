  - main [ref=f4e14]:
    - generic [ref=f4e15]:
      - heading "The 5-Minute Method" [level=1] [ref=f4e16]
      - paragraph [ref=f4e17]: A standardized clinical protocol for recording and interpreting short-term heart rate variability.
      - generic [ref=f4e18]:
        - heading "Why five minutes?" [level=2] [ref=f4e19]
        - generic [ref=f4e20]:
          - paragraph [ref=f4e21]: Twenty-four-hour Holter HRV captures circadian variation and remains necessary for several established prognostic applications. However, it is resource-intensive and often impractical for routine autonomic assessment.
          - paragraph [ref=f4e22]: A standardized five-minute recording provides a pragmatic method for measuring RMSSD, short-term SDNN, pNN50, HF power, LF power and LF/HF spectral distribution.
          - paragraph [ref=f4e23]: Five-minute values and 24-hour values are not interchangeable. Reference ranges from 24-hour Holter monitoring must not be applied to short-term recordings.
      - generic [ref=f4e24]:
        - heading "ECG as the reference method" [level=2] [ref=f4e25]
        - generic [ref=f4e26]:
          - paragraph [ref=f4e27]: ECG directly records cardiac electrical activity and identifies the R peak of the QRS complex, enabling precise RR-interval measurement.
          - list [ref=f4e28]:
            - listitem [ref=f4e29]: Direct detection of cardiac electrical activity
            - listitem [ref=f4e30]: Precise RR-interval measurement
            - listitem [ref=f4e31]: Rhythm assessment and identification of ectopic beats
            - listitem [ref=f4e32]: Reliable artefact review
            - listitem [ref=f4e33]: Appropriate time resolution
          - paragraph [ref=f4e34]: ECG is the reference method for clinical five-minute HRV analysis.
          - paragraph [ref=f4e35]: Validated ECG chest straps may also provide accurate RR intervals when the recording can be reviewed and artefacts are handled appropriately. PPG and wearable measurements may be useful for screening or exploratory applications, but require attention to motion, pulse-transit effects, device algorithms and artefact correction.
      - generic [ref=f4e36]:
        - heading "RR and NN interval analysis" [level=2] [ref=f4e37]
        - generic [ref=f4e38]:
          - paragraph [ref=f4e39]: HRV analysis begins with the detection of each heart beat from the ECG signal. The time between consecutive R peaks is the RR interval. However, not every RR interval represents normal sinus-node activation. Ectopic beats, atrial or ventricular premature complexes, and artefact from motion or electrode disturbance produce spurious intervals that must be identified and handled.
          - paragraph [ref=f4e40]: After removing non-sinus beats and correcting artefacts, the remaining intervals are called NN intervals (normal-to-normal). All standard HRV metrics—RMSSD, SDNN, pNN50, HF and LF power—are computed from the NN-interval time series, not from raw RR intervals.
          - generic [ref=f4e41]:
            - paragraph [ref=f4e42]: "Key distinction:"
            - list [ref=f4e43]:
              - listitem [ref=f4e44]:
                - strong [ref=f4e45]: "RR interval:"
                - text: the time between any two consecutive R peaks
              - listitem [ref=f4e46]:
                - strong [ref=f4e47]: "NN interval:"
                - text: an RR interval that follows a normal sinus beat
            - paragraph [ref=f4e48]: Failing to distinguish RR from NN intervals is a common source of error in HRV interpretation. Devices and software differ in how they label their output, and the user must verify whether ectopic and artefact filtering has been applied.
          - paragraph [ref=f4e49]: For short-term five-minute analysis, the NN-interval time series is also the basis for spectral analysis. After resampling and detrending, the power spectrum is computed using fast Fourier transformation or autoregressive modelling, from which HF, LF, VLF and the LF/HF ratio are derived.
      - generic [ref=f4e50]:
        - heading "Standardized recording protocol" [level=2] [ref=f4e51]
        - generic [ref=f4e52]:
          - generic [ref=f4e53]:
            - heading "Position" [level=3] [ref=f4e54]
            - list [ref=f4e55]:
              - listitem [ref=f4e56]: Supine
              - listitem [ref=f4e57]: Arms relaxed alongside the body
              - listitem [ref=f4e58]: Comfortable and motionless
          - generic [ref=f4e59]:
            - heading "Rest" [level=3] [ref=f4e60]
            - list [ref=f4e61]:
              - listitem [ref=f4e62]: Quiet rest before recording
              - listitem [ref=f4e63]: No conversation during the measurement
              - listitem [ref=f4e64]: Calm clinical environment
          - generic [ref=f4e65]:
            - heading "Breathing" [level=3] [ref=f4e66]
            - list [ref=f4e67]:
              - listitem [ref=f4e68]: Quiet spontaneous breathing
              - listitem [ref=f4e69]: Avoid deliberate deep breathing unless part of research protocol
              - listitem [ref=f4e70]: Record respiratory rate when frequency-domain interpretation is important
          - generic [ref=f4e71]:
            - heading "Duration" [level=3] [ref=f4e72]
            - list [ref=f4e73]:
              - listitem [ref=f4e74]: Approximately five minutes of analysable NN intervals
          - generic [ref=f4e75]:
            - heading "Recording quality" [level=3] [ref=f4e76]
            - list [ref=f4e77]:
              - listitem [ref=f4e78]: Sampling rate preferably at least 250 Hz
              - listitem [ref=f4e79]: Identify sinus rhythm
              - listitem [ref=f4e80]: Review ectopic beats
              - listitem [ref=f4e81]: Correct or exclude artefacts
              - listitem [ref=f4e82]: Do not apply standard sinus-rhythm HRV interpretation to AF, atrial flutter or paced ventricular rhythms
          - generic [ref=f4e83]:
            - heading "Reproducibility" [level=3] [ref=f4e84]
            - paragraph [ref=f4e85]: Comparisons require consistent position, time of day, rest period, breathing conditions, device, analysis software and artefact-correction method.
      - generic [ref=f4e86]:
        - heading "Application" [level=2] [ref=f4e87]
        - generic [ref=f4e88]:
          - paragraph [ref=f4e89]: Once a standardized recording has been obtained, the metrics can be entered into the calculator for age- and sex-stratified interpretation.
          - link "Open the calculator" [ref=f4e90] [cursor=pointer]:
            - /url: /calculator
