          - paragraph [ref=f5e93]: Developed by Willem Gielen, Cardiologist and Internist, as a practical approach to standardized five-minute HRV assessment in clinical practice and research.
          - paragraph [ref=f5e94]: 5HRV provides contextual interpretation of HRV measurements for educational and professional reference. It does not diagnose disease, replace ECG review or substitute for clinical assessment.
