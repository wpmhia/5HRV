        - region [ref=f3e227]:
          - heading "Safety" [level=3] [ref=f3e228]
          - paragraph [ref=f3e229]: Seek medical assessment for concerning symptoms such as syncope, chest pain, severe breathlessness, a sustained irregular heartbeat or new neurological symptoms. HRV interpretation must not delay urgent care.
