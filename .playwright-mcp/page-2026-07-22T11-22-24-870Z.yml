          - generic [ref=f3e191]:
            - generic [ref=f3e192]:
              - generic [ref=f3e193]:
                - heading "RMSSD" [level=3] [ref=f3e194]
                - paragraph [ref=f3e195]: 30ms
              - generic [ref=f3e196]: Within the central 50% of the reference distribution
              - paragraph [ref=f3e197]: "Reference: P5 13.27 · P25 22.9 · P50 32.77 · P75 48.62 · P95 83.03 ms"
              - paragraph [ref=f3e198]: RMSSD reflects short-term beat-to-beat variability and is strongly influenced by cardiac vagal modulation. The value falls within the central 50% of the selected age- and sex-specific reference distribution.
              - paragraph [ref=f3e199]: RMSSD does not directly measure vagal nerve activity; it is a statistical marker influenced by it.
            - generic [ref=f3e200]:
              - generic [ref=f3e201]:
                - heading "SDNN" [level=3] [ref=f3e202]
                - paragraph [ref=f3e203]: 35ms
              - generic [ref=f3e204]: Within the central 50% of the reference distribution
              - paragraph [ref=f3e205]: "Reference: P5 16.13 · P25 25.48 · P50 34.16 · P75 46.03 · P95 73.9 ms"
              - paragraph [ref=f3e206]: SDNN reflects overall variability during this five-minute recording. The value falls within the central 50% of the selected age- and sex-specific reference distribution.
              - paragraph [ref=f3e207]: Five-minute SDNN must not be compared with 24-hour Holter SDNN reference values.
