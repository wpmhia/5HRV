        - region [ref=f3e168]:
          - heading "Summary" [level=3] [ref=f3e169]
          - paragraph [ref=f3e170]: RMSSD is within the central 50% of the reference distribution and SDNN is within the central 50% of the reference distribution for the selected age and reference-sex group. RMSSD and SDNN are within the central 50% of the selected reference distribution. This does not exclude autonomic dysfunction or another medical condition.
