  - contentinfo [ref=f1e115]:
    - paragraph [ref=f1e117]: 5HRV provides contextual interpretation of five-minute HRV measurements for educational and professional reference. It does not diagnose disease, replace ECG review or substitute for clinical assessment. Calculations run entirely in your browser; entered values are not transmitted or stored. Do not enter names, identification numbers, exact dates of birth or other directly identifiable patient information.